<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome To The Graceful Celestial</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background: #514398;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            height: 265px;

            padding: 12px 4.8% 0;

            background: linear-gradient(
                to bottom,
                #514398 0%,
                #514398 45%,
                #aaa7c2 100%
            );
        }


        /* =========================
           TOP
        ========================= */

        .top {
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }


        /* =========================
           LOGO
        ========================= */

        .logo-area {
            display: flex;
            align-items: center;
        }


        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;
        }


        .logo-text {
            color: #f3be18;

            font-size: 27px;

            line-height: 1.15;

            margin-left: 10px;
        }


        /* =========================
           TOP BUTTONS
        ========================= */

        .buttons {
            display: flex;

            align-items: center;

            gap: 5px;
        }


        .buttons button {
            height: 34px;

            min-width: 58px;

            border: none;

            border-radius: 10px;

            background: white;

            color: black;

            cursor: pointer;

            font-family: Georgia, "Times New Roman", serif;
        }


        .icon {
            font-size: 24px;
        }


        .about {
            font-size: 14px;

            line-height: 13px;
        }


        .signin {
            font-size: 14px;

            padding: 0 12px;
        }


        /* =========================
           SEARCH
        ========================= */

        .search {
            width: 91%;

            height: 42px;

            margin-top: 15px;

            margin-left: 2%;

            background: white;

            border: 2px solid #111;

            display: flex;

            align-items: center;

            padding: 0 7px;
        }


        .search-icon {
            font-size: 42px;

            line-height: 1;

            transform: rotate(-20deg);
        }


        .search input {
            flex: 1;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-size: 17px;

            padding-left: 10px;
        }


        .search-camera {
            width: 31px !important;

            min-width: 31px !important;

            height: 31px !important;

            border: 3px solid black !important;

            border-radius: 5px !important;

            font-size: 18px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =========================
           BLACK HERO AREA
        ========================= */

        .hero {
            width: 100%;

            height: 460px;

            background: black;
        }


        /*
        ဒီနေရာက မင်းရဲ့
        Video / Banner / Main Image
        ထည့်မယ့်နေရာပါ။
        */


        .hero img {
            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        /* =========================
           PRODUCT AREA
        ========================= */

        .products-area {
            width: 100%;

            min-height: 800px;

            padding: 245px 4.8% 70px;

            background: linear-gradient(
                to bottom,
                #d9d7e6 0%,
                #aaa5ca 25%,
                #514398 100%
            );
        }


        .products {
            width: 100%;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 5.5%;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .card {
            width: 100%;

            background: white;

            overflow: hidden;

            border-radius: 52px;
        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image {
            width: 100%;

            height: 430px;

            background: black;

            overflow: hidden;
        }


        .product-image img {
            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        /* =========================
           PRODUCT INFO
        ========================= */

        .product-info {
            height: 110px;

            background: white;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 8px;
        }


        .price {
            font-size: 27px;
        }


        /* =========================
           BUY
        ========================= */

        .buy {
            background: black;

            color: white;

            border: none;

            border-radius: 8px;

            padding: 7px 14px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 18px;

            cursor: pointer;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                height: auto;

                padding-bottom: 25px;
            }


            .logo {
                width: 60px;

                height: 60px;
            }


            .logo-text {
                font-size: 16px;
            }


            .buttons button {
                min-width: 38px;

                height: 30px;
            }


            .icon {
                font-size: 18px;
            }


            .about {
                font-size: 10px;
            }


            .signin {
                font-size: 10px;

                padding: 0 7px;
            }


            .search {
                width: 94%;

                margin-left: 0;
            }


            .hero {
                height: 300px;
            }


            .products-area {
                padding: 120px 4% 50px;
            }


            .products {
                grid-template-columns: 1fr;

                gap: 35px;
            }


            .product-image {
                height: 380px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         HEADER
    ================================== -->

    <header>


        <div class="top">


            <!-- LOGO -->

            <div class="logo-area">

                <img
                    class="logo"
                    src="Grace Celestial colour Logo.png"
                    alt="Grace Celestial Logo"
                >


                <div class="logo-text">

                    WELCOME TO<br>

                    THE GRACEFUL CELESTIAL

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">


                <button class="icon">
                    🛒
                </button>


                <button class="icon">
                    ♥
                </button>


                <button class="icon">
                    💬
                </button>


                <button class="about">
                    About<br>
                    Us
                </button>


                <button
                    id="signIn"
                    class="signin">

                    sign in

                </button>


            </div>

        </div>


        <!-- SEARCH -->

        <div class="search">

            <span class="search-icon">
                ⌕
            </span>


            <input
                type="text"
                id="searchInput"
            >


            <button class="search-camera">
                ○
            </button>

        </div>


    </header>


    <!-- =================================
         BLACK IMAGE / VIDEO AREA
    ================================== -->

    <section class="hero">


        <!--

        ဒီနေရာမှာ မင်းရဲ့ PNG/JPG/Video
        ထည့်နိုင်တယ်။

        ဥပမာ -

        <img
            src="main-image.png"
            alt="Main Image"
        >

        -->


    </section>



    <!-- =================================
         PRODUCTS
    ================================== -->

    <main class="products-area">


        <div class="products">


            <!-- =========================
                 PRODUCT 1
            ========================== -->

            <div class="card">


                <div class="product-image">


                    <!--
                    ဒီနေရာမှာ
                    Product 1 ပုံထည့်မယ်

                    ဥပမာ -

                    <img
                        src="product1.png"
                        alt="Product 1"
                    >
                    -->


                </div>


                <div class="product-info">


                    <div class="price">
                        50,000 MMK
                    </div>


                    <button class="buy">
                        BUY
                    </button>


                </div>


            </div>



            <!-- =========================
                 PRODUCT 2
            ========================== -->

            <div class="card">


                <div class="product-image">


                    <!--
                    ဒီနေရာမှာ
                    Product 2 ပုံထည့်မယ်

                    ဥပမာ -

                    <img
                        src="product2.png"
                        alt="Product 2"
                    >
                    -->


                </div>


                <div class="product-info">


                    <div class="price">
                        50,000 MMK
                    </div>


                    <button class="buy">
                        BUY
                    </button>


                </div>


            </div>


        </div>


    </main>



    <!-- =================================
         SIGN IN JAVASCRIPT
    ================================== -->

    <script>


        const signIn =
            document.getElementById("signIn");


        let isSignedIn = false;


        signIn.addEventListener(
            "click",

            function () {


                isSignedIn = !isSignedIn;


                if (isSignedIn) {


                    /*
                    Sign in ပြီးရင်
                    လူပုံပြောင်း
                    */

                    signIn.innerHTML = "♟";

                    signIn.style.fontSize = "23px";


                } else {


                    /*
                    ပြန်နှိပ်ရင်
                    sign in ပြန်ဖြစ်
                    */

                    signIn.innerHTML = "sign in";

                    signIn.style.fontSize = "14px";


                }

            }

        );


    </script>


</body>

</html>
