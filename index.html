<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Welcome To The Graceful Celestial</title>

    <style>

        /* =========================
           BASIC
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #514398;
            font-family: Georgia, "Times New Roman", serif;
            color: black;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            width: 100%;
            padding: 12px 4.8% 0;
        }


        /* =========================
           TOP AREA
        ========================= */

        .top-bar {
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }


        /* =========================
           LOGO
        ========================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 88px;
            height: 88px;
            object-fit: contain;
        }

        .brand-name {
            color: #f3be18;
            font-size: 27px;
            line-height: 1.15;
            letter-spacing: 0.5px;
        }


        /* =========================
           TOP RIGHT BUTTONS
        ========================= */

        .top-buttons {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .top-button {
            height: 34px;
            min-width: 58px;

            border: none;
            border-radius: 10px;

            background: white;
            color: black;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-family: Georgia, "Times New Roman", serif;
        }

        .icon-button {
            font-size: 24px;
        }

        .about-button {
            font-size: 15px;
            line-height: 14px;
        }

        .signin-button {
            font-size: 14px;
            padding: 0 12px;
        }

        .user-button {
            font-size: 23px;
        }


        /* =========================
           SEARCH BAR
        ========================= */

        .search-area {
            width: 91%;
            height: 42px;

            margin-top: 15px;
            margin-bottom: 28px;
            margin-left: 2%;

            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7px;

            border: 1px solid black;
        }

        .search-icon {
            font-size: 38px;
            line-height: 1;

            transform: rotate(-20deg);

            cursor: pointer;
        }

        .search-input {
            flex: 1;

            height: 100%;

            border: none;
            outline: none;

            background: transparent;

            padding: 0 12px;

            font-size: 16px;
        }

        .search-camera {
            width: 30px;
            height: 30px;

            border: 3px solid black;
            border-radius: 5px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;

            cursor: pointer;
        }


        /* =========================
           HERO / VIDEO IMAGE AREA
        ========================= */

        .hero-area {
            width: 100%;
            height: 460px;

            background: black;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }


        /* =========================
           PRODUCTS AREA
        ========================= */

        .products-area {
            min-height: 800px;

            padding: 240px 4.8% 70px;

            background: linear-gradient(
                to bottom,
                #d8d5e8,
                #514398
            );
        }

        .products {
            width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 5.5%;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {
            width: 100%;

            overflow: hidden;

            border-radius: 52px;

            background: white;
        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image-area {
            width: 100%;
            height: 430px;

            background: black;

            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           PRODUCT INFORMATION
        ========================= */

        .product-info {
            height: 110px;

            background: white;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 7px;
        }

        .product-price {
            font-size: 28px;
        }


        /* =========================
           BUY BUTTON
        ========================= */

        .buy-button {
            background: black;
            color: white;

            border: none;

            padding: 8px 14px;

            border-radius: 8px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 18px;

            cursor: pointer;
        }

        .buy-button:hover {
            transform: scale(1.05);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 10px 3%;
            }

            .brand-logo {
                width: 60px;
                height: 60px;
            }

            .brand-name {
                font-size: 17px;
            }

            .top-buttons {
                gap: 3px;
            }

            .top-button {
                min-width: 40px;
                height: 30px;
            }

            .icon-button {
                font-size: 18px;
            }

            .about-button {
                font-size: 11px;
            }

            .signin-button {
                font-size: 10px;
                padding: 0 7px;
            }

            .search-area {
                width: 94%;
                margin-left: 0;
            }

            .hero-area {
                height: 300px;
            }

            .products-area {
                padding: 100px 3% 50px;
            }

            .products {
                grid-template-columns: 1fr;
                gap: 35px;
            }

            .product-image-area {
                height: 380px;
            }

            .product-card {
                border-radius: 38px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="top-bar">


            <!-- LOGO + BRAND NAME -->

            <div class="brand">

                <img
                    class="brand-logo"
                    src="Grace Celestial colour Logo.png"
                    alt="Grace Celestial Logo"
                >

                <div class="brand-name">
                    WELCOME TO<br>
                    THE GRACEFUL CELESTIAL
                </div>

            </div>


            <!-- TOP RIGHT BUTTONS -->

            <div class="top-buttons">

                <!-- CART -->

                <button
                    class="top-button icon-button"
                    title="Shopping Cart">
                    🛒
                </button>


                <!-- HEART -->

                <button
                    class="top-button icon-button"
                    title="Favorites">
                    ♥
                </button>


                <!-- CHAT -->

                <button
                    class="top-button icon-button"
                    title="Chat">
                    💬
                </button>


                <!-- ABOUT -->

                <button
                    class="top-button about-button">
                    About<br>Us
                </button>


                <!-- SIGN IN -->

                <button
                    id="signInButton"
                    class="top-button signin-button">
                    sign in
                </button>

            </div>

        </div>


        <!-- =========================
             SEARCH
        ========================== -->

        <div class="search-area">

            <span class="search-icon">
                ⌕
            </span>

            <input
                class="search-input"
                type="text"
                placeholder=""
            >

            <button
                class="search-camera"
                title="Image Search">
                ○
            </button>

        </div>

    </header>


    <!-- =========================
         HERO IMAGE / VIDEO
    ========================== -->

    <section class="hero-area">

        <!--
            ဒီနေရာမှာ မင်းရဲ့
            Hero / Banner / Video ပုံထည့်နိုင်တယ်။

            ဥပမာ:

            <img
                class="hero-image"
                src="hero.png"
                alt="Hero">
        -->

    </section>


    <!-- =========================
         PRODUCTS
    ========================== -->

    <main class="products-area">


        <div class="products">


            <!-- =====================
                 PRODUCT 1
            ====================== -->

            <div class="product-card">

                <div class="product-image-area">

                    <!--
                        ဒီနေရာမှာ Product 1
                        ဓာတ်ပုံထည့်ပါ။

                        ဥပမာ:

                        <img
                            class="product-image"
                            src="product1.png"
                            alt="Product 1">
                    -->

                </div>


                <div class="product-info">

                    <div class="product-price">
                        50,000 MMK
                    </div>

                    <button class="buy-button">
                        BUY
                    </button>

                </div>

            </div>


            <!-- =====================
                 PRODUCT 2
            ====================== -->

            <div class="product-card">

                <div class="product-image-area">

                    <!--
                        ဒီနေရာမှာ Product 2
                        ဓာတ်ပုံထည့်ပါ။

                        ဥပမာ:

                        <img
                            class="product-image"
                            src="product2.png"
                            alt="Product 2">
                    -->

                </div>


                <div class="product-info">

                    <div class="product-price">
                        50,000 MMK
                    </div>

                    <button class="buy-button">
                        BUY
                    </button>

                </div>

            </div>


        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const signInButton =
            document.getElementById("signInButton");


        let signedIn = false;


        signInButton.addEventListener("click", function () {

            signedIn = !signedIn;


            if (signedIn) {

                /*
                    Sign in လုပ်ပြီးတဲ့အခါ
                    "sign in" စာနေရာမှာ
                    လူပုံပြောင်းမယ်
                */

                signInButton.innerHTML = "👤";

                signInButton.classList.remove(
                    "signin-button"
                );

                signInButton.classList.add(
                    "user-button"
                );

            } else {

                /*
                    ပြန်နှိပ်ရင်
                    Sign in ပြန်ဖြစ်မယ်
                */

                signInButton.innerHTML = "sign in";

                signInButton.classList.remove(
                    "user-button"
                );

                signInButton.classList.add(
                    "signin-button"
                );

            }

        });

    </script>


</body>

</html>
